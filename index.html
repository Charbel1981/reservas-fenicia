  }
  .hero .tagbar{
    max-width:880px;margin:0 auto;padding:7px 16px 9px;text-align:center;
    font:600 11px/1 system-ui,sans-serif;letter-spacing:.36em;text-transform:uppercase;
    color:rgba(255,255,255,.72);
  }

  .tabs{max-width:880px;margin:0 auto;display:flex;gap:6px;padding:12px 14px 0}
  .tabs button{
    flex:1;padding:11px 8px;border:1px solid var(--gold-line);border-bottom:0;
    background:var(--panel-soft);color:var(--ink-soft);font-size:14px;font-weight:650;
    border-radius:12px 12px 0 0;cursor:pointer;
  }
  .tabs button[aria-selected=true]{background:var(--panel);color:var(--tyrian-2);border-color:var(--gold-line)}

  .wrap{max-width:880px;margin:0 auto;padding:0 14px 130px}
  .sheet{
    background:var(--panel);border:1px solid var(--gold-line);border-top:0;
    border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow);
    padding:14px;
  }

  /* ---------- day bar ---------- */
  .daybar{display:flex;gap:8px;margin-bottom:12px}
  .daybar .date{
    flex:1;background:var(--panel-soft);border:1px solid var(--gold-line);border-radius:12px;
    padding:9px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0;cursor:pointer;
  }
  .daybar .date .big{font-size:16px;font-weight:650;text-transform:capitalize}
  .daybar .date .small{font-size:12px;color:var(--ink-soft)}
  .daybar button.nav{
    width:46px;border:1px solid var(--gold-line);border-radius:12px;background:var(--panel-soft);
    color:var(--ink);font-size:20px;cursor:pointer;
  }
  .daybar button.today{width:auto;padding:0 14px;font-size:13px;font-weight:700;color:var(--tyrian-2);background:var(--panel-soft)}
  .daybar button:active{transform:translateY(1px)}

  .toolrow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .toolrow input[type=search]{
    flex:1;min-width:160px;padding:11px 13px;border:1px solid var(--gold-line);border-radius:11px;
    background:var(--panel-soft);color:var(--ink);font-size:15px;
  }
  .toolrow button{
    padding:11px 13px;border:1px solid var(--gold-line);border-radius:11px;background:var(--panel-soft);
    color:var(--ink);font-size:13.5px;cursor:pointer;
  }
  .toolrow button:active{transform:translateY(1px)}

  .summary{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-soft);font-size:13px;margin:0 2px 12px}
  .summary b{color:var(--ink);font-size:15px}

  h3.sec{
    font:600 14px/1 Georgia,serif;letter-spacing:.04em;color:var(--tyrian-2);
    margin:16px 2px 9px;display:flex;align-items:center;gap:7px;text-transform:uppercase;
  }
  h3.sec::before{content:"◆";color:var(--gold);font-size:11px}

  /* ---------- reservation card ---------- */
  .list{display:flex;flex-direction:column;gap:10px}
  .card{
    background:var(--panel);border:1px solid var(--gold-line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px 13px;display:flex;gap:12px;align-items:flex-start;
  }
  .card .time{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;min-width:58px;line-height:1.1}
  .card .time small{display:block;font-size:11px;font-weight:600;color:var(--mut);text-transform:capitalize}
  .card .body{flex:1;min-width:0}
  .card .name{font-size:16px;font-weight:650;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card .meta{color:var(--ink-soft);font-size:13.5px;margin-top:2px;word-break:break-word}
  .card .notes{margin-top:6px;font-size:13.5px;background:var(--panel-soft);border-radius:9px;padding:6px 9px}
  .chip{border-radius:999px;font-size:11.5px;font-weight:700;padding:2px 9px;white-space:nowrap}
  .chip.pax{background:#f0e2d8;color:var(--terra)}
  .chip.tbl{background:var(--panel-soft);color:var(--tyrian-2);border:1px solid var(--gold-line)}
  .chip.hab{background:var(--tyrian);color:#f7efe6}
  .chip.ok{background:var(--ok-soft);color:var(--ok)}
  .badge{border-radius:999px;font-size:11px;font-weight:700;padding:2px 9px;white-space:nowrap}
  .badge.pendiente{background:var(--mut-soft);color:var(--mut)}
  .badge.llegada{background:var(--ok-soft);color:var(--ok)}
  .badge.noshow{background:var(--warn-soft);color:var(--warn)}
  .badge.cancelada{background:var(--mut-soft);color:var(--mut)}
  @media (prefers-color-scheme:dark){ .chip.pax{background:#3a2b24} }
  .card.done{opacity:.5}
  .card.done .name{text-decoration:line-through}

  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .actions button{border:1px solid var(--gold-line);background:var(--panel-soft);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:13px;cursor:pointer}
  .actions button:active{transform:translateY(1px)}
  .actions button.pri{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:650}
  .actions button.wrn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .actions button.ghost{color:var(--ink-soft)}
  select.assign{border:1px solid var(--gold-line);background:var(--panel);color:var(--ink);border-radius:9px;padding:6px 8px;font-size:12.5px;max-width:150px}

  .empty{text-align:center;color:var(--ink-soft);padding:42px 16px;border:1px dashed var(--gold-line);border-radius:var(--radius)}

  /* ---------- mesas grid ---------- */
  .mesagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .mesa{
    background:var(--panel);border:1px solid var(--gold-line);border-radius:13px;box-shadow:var(--shadow);
    padding:10px 11px;min-height:96px;
  }
  .mesa.libre{background:var(--panel-soft)}
  .mesa .mh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .mesa .mh .mn{font:600 15px/1 Georgia,serif}
  .mesa .mh .mc{font-size:11px;color:var(--ink-soft)}
  .mesa .slot{font-size:12.5px;margin-top:6px;display:flex;gap:6px;align-items:center;line-height:1.3}
  .mesa .slot .d{width:7px;height:7px;border-radius:50%;flex:none}
  .d.pendiente{background:var(--mut)} .d.llegada{background:var(--ok)} .d.noshow{background:var(--warn)}
  .mesa .free{font-size:12px;color:var(--mut);margin-top:8px}
  .mesa .over{margin-top:7px;font-size:11.5px;color:var(--warn);font-weight:650}

  .tray{background:var(--warn-soft);border:1px solid var(--gold-line);border-radius:13px;padding:10px 12px;margin-bottom:12px}
  .tray .th{font-weight:700;font-size:13px;color:var(--warn);margin-bottom:8px}
  .tray .ti{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding:5px 0;border-top:1px solid var(--gold-line)}
  .tray .ti:first-of-type{border-top:0}

  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin:4px 2px 12px;flex-wrap:wrap}
  .legend span{display:flex;gap:5px;align-items:center}
  .legend .d{width:8px;height:8px;border-radius:50%}

  /* ---------- clientes ---------- */
  .clirow{
    background:var(--panel);border:1px solid var(--gold-line);border-radius:13px;box-shadow:var(--shadow);
    padding:11px 13px;display:flex;gap:12px;align-items:center;cursor:pointer;margin-bottom:9px;
  }
  .clirow .count{
    font:700 20px/1 Georgia,serif;color:var(--tyrian-2);min-width:44px;text-align:center;
  }
  .clirow .count small{display:block;font:600 10px/1 system-ui;color:var(--mut);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
  .clirow .ci{flex:1;min-width:0}
  .clirow .cn{font-weight:650;font-size:15.5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .clirow .cm{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .clirow .chev{color:var(--gold);font-size:18px}

  .clidetail .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .clidetail .hd h2{margin:0;font:600 20px/1.1 Georgia,serif}
  .backlink{background:none;border:0;color:var(--tyrian-2);font-size:14px;font-weight:650;cursor:pointer;padding:6px 2px}
  .statbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
  .stat{background:var(--panel-soft);border:1px solid var(--gold-line);border-radius:11px;padding:9px 12px;flex:1;min-width:92px}
  .stat b{display:block;font:700 19px/1 Georgia,serif;color:var(--tyrian-2)}
  .stat span{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}

  /* ---------- fab + dialog ---------- */
  .fab{position:fixed;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--sand) 55%,transparent);display:flex;justify-content:center}
  .fab button{
    width:100%;max-width:852px;padding:16px;border:2px solid var(--gold);border-radius:14px;
    background:linear-gradient(135deg,var(--tyrian),var(--tyrian-2));color:#f7efe6;font:700 17px/1 Georgia,serif;
    letter-spacing:.02em;cursor:pointer;box-shadow:0 6px 20px rgba(91,37,64,.4);
  }
  .fab button:active{transform:translateY(1px)}

  dialog{border:0;border-radius:18px;padding:0;width:min(540px,calc(100vw - 22px));background:var(--panel);color:var(--ink);box-shadow:var(--shadow);border-top:3px solid var(--gold)}
  dialog::backdrop{background:rgba(30,15,25,.5)}
  form.res,.mesasEditor{padding:18px}
  form.res h2,.mesasEditor h2{margin:0 0 14px;font:600 19px/1 Georgia,serif}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:650}
  .field input,.field textarea,.field select{
    width:100%;padding:12px;border:1px solid var(--gold-line);border-radius:11px;
    background:var(--panel-soft);color:var(--ink);font-size:16px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:58px}
  .row2{display:flex;gap:10px} .row2 .field{flex:1}
  .timepick{display:flex;align-items:center;gap:8px}
  .timepick select{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
  .timepick .colon{font-weight:700;color:var(--ink-soft)}
  .stepper{display:flex;align-items:center;border:1px solid var(--gold-line);border-radius:11px;overflow:hidden;background:var(--panel-soft)}
  .stepper button{width:50px;height:48px;border:0;background:transparent;font-size:22px;color:var(--ink);cursor:pointer}
  .stepper input{border:0;text-align:center;background:transparent;width:100%;font-size:17px;font-weight:650}
  .zonapick{display:flex;gap:8px}

  .zbtn.sel{background:linear-gradient(135deg,var(--tyrian),var(--tyrian-2));color:#fff;border-color:transparent}
  .hint{font-size:13px;margin:-4px 0 12px;padding:8px 10px;border-radius:9px;background:var(--panel-soft);color:var(--ink-soft)}
  .hint.hab{background:var(--tyrian);color:#f7efe6;font-weight:600}
  .formwarn{font-size:12.5px;color:var(--warn);margin:-4px 0 12px;font-weight:600}
  .dlg-actions{display:flex;gap:10px;margin-top:14px}
  .dlg-actions button{flex:1;padding:13px;border-radius:11px;font-size:15px;font-weight:650;cursor:pointer;border:1px solid var(--gold-line);background:var(--panel-soft);color:var(--ink)}
  .dlg-actions button.save{background:linear-gradient(135deg,var(--tyrian),var(--tyrian-2));color:#f7efe6;border-color:transparent}
  .dlg-actions button.del{background:transparent;color:var(--terra);border:0;flex:0 0 auto;padding:13px 4px}

  .medit{display:flex;gap:6px;margin-bottom:8px;align-items:center}
  .medit input{padding:9px}
  .medit input.mn{flex:2} .medit input.mz{flex:2} .medit input.mcap{flex:0 0 66px;text-align:center}
  .medit button{border:0;background:transparent;color:var(--terra);font-size:18px;cursor:pointer;padding:0 6px}
  .addmesa{background:var(--panel-soft);border:1px dashed var(--gold-line);border-radius:10px;padding:10px;width:100%;cursor:pointer;color:var(--tyrian-2);font-weight:650;font-size:14px}

  @media print{
    .hero::after,.tabs,.daybar button,.toolrow,.fab,.actions,select.assign{display:none!important}
    body{background:#fff}
    .card,.mesa{box-shadow:none;break-inside:avoid}
  }

  /* ---------- pantalla de acceso ---------- */
  body.locked > *:not(#gate){display:none!important}
  #gate{display:none}
  body.locked #gate{display:flex;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(160deg,#3f1220,#6b1f2a)}
  .gatebox{background:#fffdf8;border:1px solid #e6d6b4;border-radius:16px;padding:28px 24px;max-width:320px;width:100%;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .gatebox .gm{font:700 26px/1 Georgia,"Times New Roman",serif;letter-spacing:.14em;color:#6b1f2a;padding-left:.14em}
  .gatebox .gt{font-size:11px;color:#6f6252;margin:8px 0 20px;letter-spacing:.24em;text-transform:uppercase}
  .gatebox input{width:100%;padding:14px;font-size:24px;text-align:center;letter-spacing:.4em;border:1px solid #e6d6b4;border-radius:11px;
    background:#f7efe1;color:#2c2118;margin-bottom:12px;font-family:inherit}
  .gatebox button{width:100%;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#6b1f2a,#8a2f39);color:#fff;
    font-weight:700;font-size:16px;cursor:pointer}
  .gateerr{color:#a4472f;font-size:13px;margin-top:10px;font-weight:600}
</style>
</head>
<body class="locked">
<script>
try{ if(localStorage.getItem("reservas_fenicia_unlocked_v1")==="1"){ document.body.classList.remove("locked"); } }catch(e){}
</script>
<div id="gate">
  <div class="gatebox">
    <div class="gm">FENICIA</div>
    <div class="gt">Reservas · acceso privado</div>
    <input type="password" id="gatePin" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Código">
    <button id="gateBtn" type="button">Entrar</button>
    <div id="gateErr" class="gateerr" hidden>Código incorrecto</div>
  </div>
</div>

<div class="hero">
  <div class="banner" role="img" aria-label="Fenicia — Restaurant Libanès"></div>
  <div class="tagbar">Reservas</div>
</div>

<div class="tabs" id="tabs">
  <button data-tab="lista" aria-selected="true">Lista</button>
  <button data-tab="mesas" aria-selected="false">Mesas</button>
</div>

<div class="wrap">
  <div class="sheet">
    <div class="daybar" id="daybar">
      <button class="nav" id="prevDay" aria-label="Día anterior">‹</button>
      <div class="date" id="dateBox">
        <span class="big" id="dateBig">—</span>
        <span class="small" id="dateSmall"></span>
      </div>
      <button class="nav today" id="todayBtn">Hoy</button>
      <button class="nav" id="nextDay" aria-label="Día siguiente">›</button>
    </div>
    <div id="view"></div>
  </div>
</div>

<div class="fab"><button id="newBtn">＋ Nueva reserva</button></div>

<!-- reserva -->
<dialog id="dlg">
  <form class="res" id="form" method="dialog">
    <h2 id="formTitle">Nueva reserva</h2>
    <input type="hidden" id="f_id">
    <div class="row2">
      <div class="field"><label for="f_fecha">Fecha</label><input type="date" id="f_fecha" required></div>
      <div class="field"><label>Hora</label>
        <div class="timepick">
          <select id="f_hora_h"></select>
          <span class="colon">:</span>
          <select id="f_hora_m"></select>
        </div>
      </div>
    </div>
    <div class="field"><label for="f_nombre">Nombre</label><input type="text" id="f_nombre" autocomplete="off" required placeholder="A nombre de…"></div>
    <div id="cliHint" class="hint" hidden></div>
    <div class="row2">
      <div class="field"><label for="f_tel">Teléfono <span style="color:var(--terra)">*</span></label><input type="tel" id="f_tel" autocomplete="off" inputmode="tel" placeholder="Obligatorio"></div>
      <div class="field"><label for="f_pax">Personas</label>
        <div class="stepper">
          <button type="button" id="paxMinus" aria-label="Menos">–</button>

    <div id="formWarn" class="formwarn" hidden></div>

    <div class="dlg-actions">
      <button type="button" class="del" id="delBtn" hidden>Eliminar</button>

<!-- mesas -->
<dialog id="dlgMesas">
  <div class="mesasEditor">
    <h2>Ajustes</h2>
    <div class="field"><label for="cfgTel">Teléfono del local <span style="font-weight:400;color:var(--ink-soft)">(aparece en el SMS de confirmación)</span></label>
      <input type="tel" id="cfgTel" placeholder="Por defecto: 93 330 01 46"></div>
    <div class="field"><label for="cfgSMS">Texto del SMS de confirmación</label>
      <textarea id="cfgSMS" rows="4" placeholder="Déjalo vacío para usar el texto por defecto"></textarea>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.55">
        Se rellenan solas: <b>{nombre}</b> · {nombre_completo} · <b>{fecha}</b> · <b>{hora}</b> · <b>{personas}</b> · {local}<br>
        El número de mesa no se envía al cliente.
      </div></div>

    <button type="button" class="addmesa" id="addMesaBtn">＋ Añadir mesa</button>

      <button type="button" id="mesasCancel">Cerrar</button>
      <button type="button" class="save" id="mesasSave">Guardar</button>
    </div>
  </div>
</dialog>

<script>
(function(){
  "use strict";
  var K = { res:"reservas_fenicia_v1", mesas:"reservas_fenicia_mesas_v2", seen:"reservas_fenicia_seen_v2", cfg:"reservas_fenicia_cfg_v1" };
  var EST = { pendiente:"Pendiente", llegada:"Llegó", noshow:"No vino", cancelada:"Cancelada" };
  var DEF_MESAS = [];
  for (var _i=1; _i<=21; _i++){
    DEF_MESAS.push({ id:"s"+_i, nombre:String(_i), zona:"Sala",
      capacidad: _i<=6 ? 2 : (_i<=16 ? 4 : (_i<=20 ? 6 : 8)) });
  }
  for (var _j=23; _j<=36; _j++){
    DEF_MESAS.push({ id:"t"+_j, nombre:String(_j), zona:"Terraza",
      capacidad: _j<=28 ? 2 : (_j<=34 ? 4 : 6) });
  }

  var state = { tab:"lista", fecha: todayISO(), buscar:"", cliSel:null,
                reservas: loadArr(K.res), mesas: loadArr(K.mesas), _cliMap:{}, _cliList:[] };
  if (!state.mesas.length){ state.mesas = DEF_MESAS.slice(); saveArr(K.mesas, state.mesas); }

  var cfg = loadCfg();
  function loadCfg(){ try{ var v=JSON.parse(localStorage.getItem(K.cfg)); return (v&&typeof v==="object")?v:{telLocal:"",plantillaSMS:""}; }catch(e){ return {telLocal:"",plantillaSMS:""}; } }
  function saveCfg(){ try{ localStorage.setItem(K.cfg, JSON.stringify(cfg)); }catch(e){} }

  function loadArr(k){ try{ var v=JSON.parse(localStorage.getItem(k)); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
  function saveArr(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ alert("No se ha podido guardar."); } }
  function persist(){ saveArr(K.res, state.reservas); }
  function persistMesas(){ saveArr(K.mesas, state.mesas); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function addDays(iso,n){ var p=iso.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function fechaLarga(iso){ var p=iso.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"}); }
  function fechaCorta(iso){ var p=iso.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"}); }
  function relLabel(iso){ if(iso===todayISO())return"Hoy"; if(iso===addDays(todayISO(),1))return"Mañana"; if(iso===addDays(todayISO(),-1))return"Ayer"; return""; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  function toMin(h){ var p=(h||"0:0").split(":"); return (+p[0])*60+(+p[1]); }
  function telNorm(t){ var d=(t||"").replace(/\D/g,""); if(d.length>=11 && d.indexOf("34")===0) d=d.slice(2); return d; }
  function cliKey(nombre,tel){ var d=telNorm(tel); return d ? "t:"+d : "n:"+(nombre||"").trim().toLowerCase(); }
  function mesaById(id){ for(var i=0;i<state.mesas.length;i++) if(state.mesas[i].id===id) return state.mesas[i]; return null; }
  function mesaLabel(id){ var m=mesaById(id); return m ? ("Mesa "+m.nombre) : ""; }
  function telE164(t){ var d=telNorm(t); return d ? "+34"+d : ""; }
  function nombrePila(n){ return (n||"").trim().split(/\s+/)[0] || ""; }
  function msgConfirma(r){
    var pax=parseInt(r.personas,10)||0;
    var tpl=cfg.plantillaSMS&&cfg.plantillaSMS.trim();
    if(!tpl){
      // El numero de mesa NO se envia al cliente (lo gestionan los camareros).
      return "Hola "+nombrePila(r.nombre)+", tu reserva en Fenicia queda confirmada: "+
        fechaLarga(r.fecha).replace(",","")+" a las "+r.hora+", "+pax+(pax===1?" persona":" personas")+"."+
        " Para cualquier cambio en tu reserva, por favor llama al "+(cfg.telLocal||"93 330 01 46")+".";
    }
    var map={
      "{nombre}":nombrePila(r.nombre),
      "{nombre_completo}":(r.nombre||"").trim(),
      "{fecha}":fechaLarga(r.fecha).replace(",",""),
      "{hora}":r.hora||"",
      "{personas}":String(pax),
      "{local}":cfg.telLocal||"93 330 01 46"
    };
    return tpl.replace(/\{nombre_completo\}|\{nombre\}|\{fecha\}|\{hora\}|\{personas\}|\{local\}/g,
      function(k){ return map[k]; }).replace(/[ \t]{2,}/g," ").replace(/ +([.,;:])/g,"$1").trim();
  }
  // El SMS sale sin tildes (así el operador no lo cobra como varios SMS). Se mantienen la ñ y la ç.
  function quitarTildes(s){
    return String(s)
      .replace(/[áàâä]/g,"a").replace(/[ÁÀÂÄ]/g,"A")
      .replace(/[éèêë]/g,"e").replace(/[ÉÈÊË]/g,"E")
      .replace(/[íìîï]/g,"i").replace(/[ÍÌÎÏ]/g,"I")
      .replace(/[óòôö]/g,"o").replace(/[ÓÒÔÖ]/g,"O")
      .replace(/[úùûü]/g,"u").replace(/[ÚÙÛÜ]/g,"U");
  }
  function smsHref(r){ return "sms:"+telE164(r.telefono)+"?body="+encodeURIComponent(quitarTildes(msgConfirma(r))); }
  function enviarSMS(r){
    r.avisoEnviado=new Date().toISOString(); persist();
    window.location.href=smsHref(r);   // primero se lanza la app de Mensajes, sin esperar al repintado
    render();
  }

  // ---------- clientes ----------
  function buildClientes(){
    var map={};
    state.reservas.forEach(function(r){
      var k=cliKey(r.nombre,r.telefono);
      var m=map[k] || (map[k]={key:k,nombre:"",telefono:"",items:[]});
      m.items.push(r);
      if(r.telefono && !m.telefono) m.telefono=r.telefono;
    });
    var t=todayISO();
    var list=Object.keys(map).map(function(k){
      var m=map[k];
      m.items.sort(function(a,b){ return (a.fecha+a.hora).localeCompare(b.fecha+b.hora); });
      for(var i=m.items.length-1;i>=0;i--){ if(m.items[i].nombre){ m.nombre=m.items[i].nombre; break; } }
      m.cancel=m.items.filter(function(r){return r.estado==="cancelada";}).length;
      m.noshow=m.items.filter(function(r){return r.estado==="noshow";}).length;
      m.visitas=m.items.filter(function(r){return r.estado==="llegada";}).length;
      m.reservas=m.items.length - m.cancel;
      var pas=m.items.filter(function(r){return r.fecha<t || r.estado==="llegada" || r.estado==="noshow";});
      var fut=m.items.filter(function(r){return r.fecha>=t && r.estado!=="cancelada" && r.estado!=="llegada" && r.estado!=="noshow";});
      m.ultima=pas.length? pas[pas.length-1].fecha : null;
      m.proxima=fut.length? fut[0].fecha : null;
      m.habitual=m.reservas>=3;
      return m;
    });
    list.sort(function(a,b){ return b.reservas-a.reservas || (b.ultima||"").localeCompare(a.ultima||""); });
    state._cliMap=map; state._cliList=list;
  }

  // ---------- render ----------
  var view=document.getElementById("view");
  var daybar=document.getElementById("daybar");

  function render(){
    buildClientes();
    var tb=document.getElementById("tabs").children;
    for(var i=0;i<tb.length;i++) tb[i].setAttribute("aria-selected", tb[i].dataset.tab===state.tab);

    document.getElementById("dateBig").textContent=fechaLarga(state.fecha);
    var rel=relLabel(state.fecha);
    document.getElementById("dateSmall").textContent=(rel?rel+" · ":"")+state.fecha;
    daybar.hidden = (state.tab==="clientes");

    if(state.tab==="lista") viewLista();
    else if(state.tab==="mesas") viewMesas();
    else viewClientes();
  }

  function resDia(iso){ return state.reservas.filter(function(r){return r.fecha===iso;})
    .sort(function(a,b){return (a.hora||"").localeCompare(b.hora||"");}); }

  function cardHTML(r, opts){
    opts=opts||{};
    var done=r.estado==="cancelada"||r.estado==="noshow";
    var meta=[];
    if(r.telefono) meta.push('<a href="tel:'+esc(r.telefono)+'" style="color:inherit">'+esc(r.telefono)+'</a>');
    if(opts.showDate) meta.push(fechaCorta(r.fecha));
    var zonaChip = r.zona ? '<span class="chip tbl">'+esc(r.zona)+'</span>' : '';
    var mesaChip = r.mesaId ? '<span class="chip tbl">'+esc(mesaLabel(r.mesaId))+'</span>' : '';
    var habChip = '';
    var avisoChip = r.avisoEnviado ? '<span class="chip ok">✓ SMS enviado</span>' : '';
    return '<div class="card '+(done?"done":"")+'">'+
      '<div class="time">'+esc(r.hora||"--:--")+(opts.showDate?'<small>'+esc(fechaCorta(r.fecha))+'</small>':'')+'</div>'+
      '<div class="body">'+
        '<div class="name">'+esc(r.nombre)+
          '<span class="chip pax">'+(parseInt(r.personas,10)||0)+' pax</span>'+zonaChip+mesaChip+habChip+avisoChip+
          '<span class="badge '+r.estado+'">'+EST[r.estado]+'</span>'+
        '</div>'+
        (meta.length?'<div class="meta">'+meta.join(" · ")+'</div>':'')+
        (r.notas?'<div class="notes">'+esc(r.notas)+'</div>':'')+
        '<div class="actions">'+
          (r.estado!=="llegada"?'<button class="pri" data-act="llegada" data-id="'+r.id+'">Llegó</button>'
                               :'<button data-act="pendiente" data-id="'+r.id+'">Deshacer</button>')+
          (r.estado!=="noshow"?'<button class="wrn" data-act="noshow" data-id="'+r.id+'">No vino</button>':'')+
          (r.estado!=="cancelada"?'<button class="ghost" data-act="cancelada" data-id="'+r.id+'">Cancelar</button>'
                                 :'<button data-act="pendiente" data-id="'+r.id+'">Reactivar</button>')+
          '<button class="ghost" data-act="edit" data-id="'+r.id+'">Editar</button>'+
          (r.estado!=="cancelada"?'<button class="'+(r.avisoEnviado?"ghost":"pri")+'" data-sms="'+r.id+'">'+(r.avisoEnviado?"Reenviar SMS":"Enviar SMS")+'</button>':'')+
          mesaSelect(r.mesaId, r.id)+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function mesaSelect(sel, resId){
    var zonas=[]; state.mesas.forEach(function(m){ if(zonas.indexOf(m.zona)<0) zonas.push(m.zona); });
    var h='<select class="assign" data-assign="'+resId+'"><option value="">— sin mesa —</option>';
    zonas.forEach(function(z){
      h+='<optgroup label="'+esc(z)+'">';
      state.mesas.filter(function(m){return m.zona===z;}).forEach(function(m){
        h+='<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>'+esc(m.nombre)+' ('+m.capacidad+')</option>';
      });
      h+='</optgroup>';
    });
    return h+'</select>';
  }

  function toolbar(ph){
    return '<div class="toolrow"><input type="search" id="search" placeholder="'+ph+'" value="'+esc(state.buscar)+'">'+
      (state.tab==="lista"?'<button id="copyBtn">Copiar lista</button><button id="printBtn">Imprimir</button>':'')+
      (state.tab==="mesas"?'<button id="cfgMesas">⚙ Ajustes</button>':'')+'</div>';
  }

  function viewLista(){
    var searching=state.buscar.trim().length>0, rows;
    if(searching){
      var q=state.buscar.trim().toLowerCase();
      rows=state.reservas.filter(function(r){ return (r.nombre||"").toLowerCase().indexOf(q)>=0 || (r.telefono||"").toLowerCase().indexOf(q)>=0; })
        .sort(function(a,b){ return (a.fecha+a.hora).localeCompare(b.fecha+b.hora); });
    } else {
      rows=resDia(state.fecha);
    }
    var act=rows.filter(function(r){return r.estado!=="cancelada"&&r.estado!=="noshow";});
    var pax=act.reduce(function(s,r){return s+(parseInt(r.personas,10)||0);},0);
    var lleg=rows.filter(function(r){return r.estado==="llegada";}).length;

    var html=toolbar("Buscar por nombre o teléfono (todas las fechas)")+
      '<div class="summary"><span><b>'+act.length+'</b> reservas</span><span><b>'+pax+'</b> comensales</span>'+
      (searching?'':'<span><b>'+lleg+'</b> han llegado</span>')+'</div>';
    html += rows.length
      ? '<div class="list">'+rows.map(function(r){return cardHTML(r,{showDate:searching});}).join("")+'</div>'
      : '<div class="empty">'+(searching?"Sin resultados.":"No hay reservas para este día.<br>Pulsa <b>＋ Nueva reserva</b>.")+'</div>';
    view.innerHTML=html;
    wireToolbar();
  }

  function viewMesas(){
    var rows=resDia(state.fecha).filter(function(r){return r.estado!=="cancelada";});
    var sinMesa=rows.filter(function(r){return !r.mesaId || !mesaById(r.mesaId);});
    var html=toolbar("")+
      '<div class="legend"><span><i class="d pendiente"></i>Pendiente</span><span><i class="d llegada"></i>Llegó</span><span><i class="d noshow"></i>No vino</span></div>';

    if(sinMesa.length){
      html+='<div class="tray"><div class="th">Sin mesa asignada ('+sinMesa.length+')</div>'+
        sinMesa.map(function(r){
          return '<div class="ti"><b>'+esc(r.hora)+'</b> '+esc(r.nombre)+' · '+(parseInt(r.personas,10)||0)+' pax '+mesaSelect(r.mesaId,r.id)+'</div>';
        }).join("")+'</div>';
    }

    var zonas=[]; state.mesas.forEach(function(m){ if(zonas.indexOf(m.zona)<0) zonas.push(m.zona); });
    zonas.forEach(function(z){
      html+='<h3 class="sec">'+esc(z)+'</h3><div class="mesagrid">';
      state.mesas.filter(function(m){return m.zona===z;}).forEach(function(m){
        var res=rows.filter(function(r){return r.mesaId===m.id;}).sort(function(a,b){return (a.hora||"").localeCompare(b.hora||"");});
        var over=false;
        for(var i=0;i<res.length;i++){
          if((parseInt(res[i].personas,10)||0)>m.capacidad) over=true;
          for(var j=i+1;j<res.length;j++) if(Math.abs(toMin(res[i].hora)-toMin(res[j].hora))<90) over=true;
        }
        html+='<div class="mesa '+(res.length?'':'libre')+'">'+
          '<div class="mh"><span class="mn">'+esc(m.nombre)+'</span><span class="mc">'+m.capacidad+' pax</span></div>'+
          (res.length? res.map(function(r){
              return '<div class="slot"><i class="d '+r.estado+'"></i><span><b>'+esc(r.hora)+'</b> '+esc(r.nombre)+' ('+(parseInt(r.personas,10)||0)+')</span></div>';
            }).join("")
           : '<div class="free">Libre</div>')+
          (over?'<div class="over">⚠ Revisar: aforo u horas solapadas</div>':'')+
        '</div>';
      });
      html+='</div>';
    });
    view.innerHTML=html;
    wireToolbar();
  }

  function viewClientes(){
    if(state.cliSel){ viewClienteDetalle(); return; }
    var q=state.buscar.trim().toLowerCase();
    var list=state._cliList.filter(function(m){
      return !q || (m.nombre||"").toLowerCase().indexOf(q)>=0 || (m.telefono||"").indexOf(q)>=0;
    });
    var html=toolbar("Buscar cliente por nombre o teléfono")+
      '<div class="summary"><span><b>'+state._cliList.length+'</b> clientes en el registro</span></div>';
    html += list.length ? list.map(function(m){
      return '<div class="clirow" data-cli="'+esc(m.key)+'">'+
        '<div class="count">'+m.reservas+'<small>reservas</small></div>'+
        '<div class="ci"><div class="cn">'+esc(m.nombre||"(sin nombre)")+
          (m.habitual?' <span class="chip hab">Habitual</span>':'')+'</div>'+
          '<div class="cm">'+(m.telefono?esc(m.telefono)+' · ':'')+
            m.visitas+' visitas · '+m.noshow+' no-show'+
            (m.proxima?' · próxima '+fechaCorta(m.proxima):(m.ultima?' · última '+fechaCorta(m.ultima):''))+
          '</div></div>'+
        '<div class="chev">›</div></div>';
    }).join("") : '<div class="empty">Sin clientes todavía. Se crean solos al guardar reservas.</div>';
    view.innerHTML=html;
    wireToolbar();
  }

  function viewClienteDetalle(){
    var m=state._cliMap[state.cliSel];
    if(!m){ state.cliSel=null; return viewClientes(); }
    var items=m.items.slice().sort(function(a,b){ return (b.fecha+b.hora).localeCompare(a.fecha+a.hora); });
    var html='<div class="clidetail">'+
      '<button class="backlink" id="cliBack">‹ Volver al registro</button>'+
      '<div class="hd"><h2>'+esc(m.nombre||"(sin nombre)")+'</h2>'+(m.habitual?'<span class="chip hab">Habitual</span>':'')+'</div>'+
      (m.telefono?'<div class="meta"><a href="tel:'+esc(m.telefono)+'" style="color:inherit">'+esc(m.telefono)+'</a></div>':'')+
      '<div class="statbar">'+
        '<div class="stat"><b>'+m.reservas+'</b><span>Reservas</span></div>'+
        '<div class="stat"><b>'+m.visitas+'</b><span>Visitas</span></div>'+
        '<div class="stat"><b>'+m.noshow+'</b><span>No-show</span></div>'+
        '<div class="stat"><b>'+m.cancel+'</b><span>Canceladas</span></div>'+
      '</div>'+
      '<h3 class="sec">Historial</h3>'+
      items.map(function(r){
        return '<div class="clirow" data-goto="'+esc(r.fecha)+'">'+
          '<div class="count" style="font-size:13px;min-width:58px">'+esc(fechaCorta(r.fecha))+'</div>'+
          '<div class="ci"><div class="cn">'+esc(r.hora)+' · '+(parseInt(r.personas,10)||0)+' pax'+
            (r.mesaId?' · '+esc(mesaLabel(r.mesaId)):'')+'</div>'+
            '<div class="cm">'+(r.notas?esc(r.notas):'—')+'</div></div>'+
          '<span class="badge '+r.estado+'">'+EST[r.estado]+'</span></div>';
      }).join("")+
    '</div>';
    view.innerHTML=html;
    document.getElementById("cliBack").onclick=function(){ state.cliSel=null; render(); };
    Array.prototype.forEach.call(view.querySelectorAll("[data-goto]"),function(el){
      el.onclick=function(){ state.tab="lista"; state.fecha=el.dataset.goto; state.buscar=""; state.cliSel=null; render(); };
    });
  }

  // ---------- toolbar wiring ----------
  function wireToolbar(){
    var s=document.getElementById("search");
    if(s) s.addEventListener("input",function(e){ state.buscar=e.target.value; render(); });
    var c=document.getElementById("copyBtn"); if(c) c.onclick=copyDia;
    var p=document.getElementById("printBtn"); if(p) p.onclick=function(){ window.print(); };
    var g=document.getElementById("cfgMesas"); if(g) g.onclick=openMesas;
  }

  function copyDia(){
    var rows=resDia(state.fecha).filter(function(r){return r.estado!=="cancelada";});
    var pax=rows.filter(function(r){return r.estado!=="noshow";}).reduce(function(s,r){return s+(parseInt(r.personas,10)||0);},0);
    var txt="Reservas "+fechaCorta(state.fecha)+" — "+rows.length+" reservas / "+pax+" pax\n"+
      rows.map(function(r){
        return (r.hora||"--:--")+"  "+r.nombre+" ("+(parseInt(r.personas,10)||0)+")"+
          (r.mesaId?"  ["+mesaLabel(r.mesaId)+"]":"")+
          (r.telefono?"  "+r.telefono:"")+
          (r.notas?"  — "+r.notas:"")+
          (r.estado==="noshow"?"  [NO VINO]":"");
      }).join("\n");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        var b=document.getElementById("copyBtn"); if(b){ var o=b.textContent; b.textContent="Copiado ✓"; setTimeout(function(){b.textContent=o;},1400); }
      },function(){ window.prompt("Copia manualmente:",txt); });
    } else window.prompt("Copia manualmente:",txt);
  }

  // ---------- list actions (delegated on view) ----------
  view.addEventListener("click",function(e){
    var b=e.target.closest("button[data-act]");
    if(b){
      var r=state.reservas.find(function(x){return x.id===b.dataset.id;});
      if(!r) return;
      if(b.dataset.act==="edit"){ openForm(r); return; }
      r.estado=b.dataset.act; persist(); render(); return;
    }
    var sb=e.target.closest("button[data-sms]");
    if(sb){
      var rs=state.reservas.find(function(x){return x.id===sb.dataset.sms;});
      if(rs) enviarSMS(rs);
      return;
    }
    var row=e.target.closest("[data-cli]");
    if(row){ state.cliSel=row.dataset.cli; render(); }
  });
  view.addEventListener("change",function(e){
    var s=e.target.closest("select[data-assign]");
    if(!s) return;
    var r=state.reservas.find(function(x){return x.id===s.dataset.assign;});
    if(r){ r.mesaId=s.value||null; persist(); render(); }
  });

  // ---------- tabs / daybar ----------
  document.getElementById("tabs").addEventListener("click",function(e){
    var b=e.target.closest("button[data-tab]"); if(!b) return;
    state.tab=b.dataset.tab; state.buscar=""; state.cliSel=null; render();
  });
  document.getElementById("prevDay").onclick=function(){ state.fecha=addDays(state.fecha,-1); render(); };
  document.getElementById("nextDay").onclick=function(){ state.fecha=addDays(state.fecha,1); render(); };
  document.getElementById("todayBtn").onclick=function(){ state.fecha=todayISO(); render(); };
  document.getElementById("dateBox").onclick=function(){
    var v=prompt("Ir a fecha (AAAA-MM-DD):",state.fecha);
    if(v && /^\d{4}-\d{2}-\d{2}$/.test(v)){ state.fecha=v; render(); }
  };

  // ---------- reserva form ----------
  var dlg=document.getElementById("dlg"), form=document.getElementById("form"), fPax=document.getElementById("f_pax");
  document.getElementById("paxMinus").onclick=function(){ fPax.value=Math.max(1,(parseInt(fPax.value,10)||1)-1); checkWarn(); };
  Array.prototype.forEach.call(document.querySelectorAll(".zbtn"), function(b){
    b.addEventListener("click", function(){
      document.getElementById("f_zona").value = b.dataset.zona;
      Array.prototype.forEach.call(document.querySelectorAll(".zbtn"), function(x){ x.classList.remove("sel"); });
      b.classList.add("sel");
    });
  });
  document.getElementById("paxPlus").onclick =function(){ fPax.value=Math.min(99,(parseInt(fPax.value,10)||1)+1); checkWarn(); };
  document.getElementById("cancelBtn").onclick=function(){ dlg.close(); };
  document.getElementById("newBtn").onclick=function(){ openForm(null); };

  function fillMesaSelect(sel){
    var el=document.getElementById("f_mesa");
    var zonas=[]; state.mesas.forEach(function(m){ if(zonas.indexOf(m.zona)<0) zonas.push(m.zona); });
    var h='<option value="">— sin asignar —</option>';
    zonas.forEach(function(z){
      h+='<optgroup label="'+esc(z)+'">';
      state.mesas.filter(function(m){return m.zona===z;}).forEach(function(m){
        h+='<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>'+esc(m.nombre)+' · '+m.capacidad+' pax</option>';
      });
      h+='</optgroup>';
    });
    el.innerHTML=h;
  }

  function refreshCliHint(){
    var box=document.getElementById("cliHint");
    box.hidden=true; return;   // sin historial de clientes: no se muestra aviso
    var key=cliKey(document.getElementById("f_nombre").value, document.getElementById("f_tel").value);
    var m=state._cliMap[key];
    var editingId=document.getElementById("f_id").value;
    var prev = m ? m.items.filter(function(r){return r.id!==editingId;}) : [];
    if(prev.length){
      var canc=prev.filter(function(r){return r.estado==="cancelada";}).length;
      var n=prev.length-canc;
      box.hidden=false;
      box.className="hint"+(n>=3?" hab":"");
      box.textContent=(n>=3?"◆ Cliente habitual · ":"Cliente conocido · ")+n+" reserva"+(n===1?"":"s")+
        (m.ultima?" · última "+fechaCorta(m.ultima):"")+(m.noshow?" · "+m.noshow+" no-show":"");
      if(!document.getElementById("f_nombre").value && m.nombre) document.getElementById("f_nombre").value=m.nombre;
    } else { box.hidden=true; box.textContent=""; }
  }

  function checkWarn(){
    var w=document.getElementById("formWarn");
    var msgs=[];
    var mid=document.getElementById("f_mesa").value;
    var pax=parseInt(fPax.value,10)||1;
    var fecha=document.getElementById("f_fecha").value, hora=getHoraVal();
    var editingId=document.getElementById("f_id").value;
    if(mid){
      var m=mesaById(mid);
      if(m && pax>m.capacidad) msgs.push("La mesa "+m.nombre+" es para "+m.capacidad+" y has puesto "+pax+".");
      if(hora){
        var clash=state.reservas.filter(function(r){
          return r.id!==editingId && r.mesaId===mid && r.fecha===fecha && r.estado!=="cancelada" &&
                 Math.abs(toMin(r.hora)-toMin(hora))<90;
        });
        if(clash.length) msgs.push("Esa mesa ya tiene "+clash[0].nombre+" a las "+clash[0].hora+".");
      }
    }
    w.hidden=!msgs.length; w.innerHTML=msgs.join("<br>");
  }

  (function fillTimeSelects(){
    var hSel=document.getElementById("f_hora_h"), mSel=document.getElementById("f_hora_m");
    var hh="<option value=\"\">--</option>";
    for(var i=0;i<24;i++){ var v=String(i).padStart(2,"0"); hh+="<option value=\""+v+"\">"+v+"</option>"; }
    hSel.innerHTML=hh;
    var mm="<option value=\"\">--</option>";
    for(var j=0;j<60;j+=5){ var v2=String(j).padStart(2,"0"); mm+="<option value=\""+v2+"\">"+v2+"</option>"; }
    mSel.innerHTML=mm;
  })();
  function getHoraVal(){
    var h=document.getElementById("f_hora_h").value, m=document.getElementById("f_hora_m").value;
    return (h && m) ? (h+":"+m) : "";
  }
  function setHoraVal(v){
    var p=(v||"").split(":");
    var hSel=document.getElementById("f_hora_h"), mSel=document.getElementById("f_hora_m");
    hSel.value = p[0]||"";
    mSel.value = p[1]||"";
    if(p[1] && mSel.value!==p[1]){
      var opt=document.createElement("option"); opt.value=p[1]; opt.textContent=p[1];
      mSel.appendChild(opt); mSel.value=p[1];
    }
  }

  function openForm(r){
    document.getElementById("formTitle").textContent=r?"Editar reserva":"Nueva reserva";
    document.getElementById("f_id").value=r?r.id:"";
    document.getElementById("f_fecha").min=todayISO();
    document.getElementById("f_fecha").value=r?r.fecha:(state.fecha<todayISO()?todayISO():state.fecha);
    setHoraVal(r?r.hora:"");
    document.getElementById("f_nombre").value=r?r.nombre:"";
    document.getElementById("f_tel").value=r?(r.telefono||""):"";
    fPax.value=r?(parseInt(r.personas,10)||2):2;
    document.getElementById("f_notas").value=r?(r.notas||""):"";
    document.getElementById("f_zona").value = r ? (r.zona||"") : "";
    Array.prototype.forEach.call(document.querySelectorAll(".zbtn"), function(b){
      b.classList.toggle("sel", b.dataset.zona === (r ? (r.zona||"") : ""));
    });
    fillMesaSelect(r?r.mesaId:"");
    document.getElementById("cliHint").hidden=true;
    document.getElementById("formWarn").hidden=true;
    var del=document.getElementById("delBtn");
    del.hidden=!r;
    del.onclick=r?function(){
      if(confirm("¿Eliminar la reserva de "+r.nombre+"?")){
        state.reservas=state.reservas.filter(function(x){return x.id!==r.id;});
        persist(); dlg.close(); render();
      }
    }:null;
    if(r) refreshCliHint();
    if(typeof dlg.showModal==="function") dlg.showModal(); else dlg.setAttribute("open","");
    setTimeout(function(){ document.getElementById("f_hora_h").focus(); },50);
  }

  document.getElementById("f_tel").addEventListener("input",function(){ refreshCliHint(); });
  document.getElementById("f_nombre").addEventListener("blur",function(){ refreshCliHint(); });
  document.getElementById("f_mesa").addEventListener("change",checkWarn);
  document.getElementById("f_hora_h").addEventListener("change",checkWarn);
  document.getElementById("f_hora_m").addEventListener("change",checkWarn);
  document.getElementById("f_fecha").addEventListener("change",checkWarn);

  form.addEventListener("submit",function(e){
    e.preventDefault();
    var id=document.getElementById("f_id").value;
    var data={
      fecha:document.getElementById("f_fecha").value,
      hora:getHoraVal(),
      nombre:document.getElementById("f_nombre").value.trim(),
      telefono:document.getElementById("f_tel").value.trim(),
      personas:Math.max(1,parseInt(fPax.value,10)||1),
      zona:document.getElementById("f_zona").value,
      mesaId:document.getElementById("f_mesa").value||null,
      notas:document.getElementById("f_notas").value.trim()
    };
    if(!data.nombre||!data.fecha||!data.hora) return;
    if(telNorm(data.telefono).length < 9){
      var w=document.getElementById("formWarn");
      w.hidden=false; w.textContent="Falta el teléfono: es obligatorio para guardar la reserva (9 dígitos).";
      document.getElementById("f_tel").focus();
      return;
    }
    if(!data.zona){
      var w2=document.getElementById("formWarn");
      w2.hidden=false; w2.textContent="Elige Sala o Terraza antes de guardar.";
      return;
    }
    var esNueva=!id;
    if(id){
      var r=state.reservas.find(function(x){return x.id===id;});
      if(r) Object.assign(r,data);
    } else {
      data.id=uid(); data.estado="pendiente"; data.creadaEn=new Date().toISOString();
      state.reservas.push(data);
      if(state.tab!=="clientes") state.fecha=data.fecha;
    }
    persist(); dlg.close();
    state.buscar=""; state.cliSel=null;
    if(esNueva){
      data.avisoEnviado=new Date().toISOString(); persist();
      window.location.href=smsHref(data);   // se lanza cuanto antes, antes del repintado
    }
    render();
  });
  dlg.addEventListener("close",function(){ form.reset(); });

  // ---------- mesas editor ----------
  var dlgM=document.getElementById("dlgMesas");
  var draftMesas=[];
  function openMesas(){
    draftMesas=state.mesas.map(function(m){return {id:m.id,nombre:m.nombre,zona:m.zona,capacidad:m.capacidad};});
    document.getElementById("cfgTel").value=cfg.telLocal||"";
    document.getElementById("cfgSMS").value=cfg.plantillaSMS||"";
    renderMedit();
    if(typeof dlgM.showModal==="function") dlgM.showModal(); else dlgM.setAttribute("open","");
  }
  function renderMedit(){
    document.getElementById("meditList").innerHTML=draftMesas.map(function(m,i){
      return '<div class="medit">'+
        '<input class="mn" value="'+esc(m.nombre)+'" data-i="'+i+'" data-f="nombre" placeholder="Nombre">'+
        '<input class="mz" value="'+esc(m.zona)+'" data-i="'+i+'" data-f="zona" placeholder="Zona">'+
        '<input class="mcap" type="number" min="1" value="'+m.capacidad+'" data-i="'+i+'" data-f="capacidad">'+
        '<button type="button" data-del="'+i+'" aria-label="Eliminar">✕</button></div>';
    }).join("");
  }
  document.getElementById("meditList").addEventListener("input",function(e){
    var el=e.target.closest("input[data-i]"); if(!el) return;
    var m=draftMesas[+el.dataset.i], f=el.dataset.f;
    m[f]= f==="capacidad" ? (Math.max(1,parseInt(el.value,10)||1)) : el.value;
  });
  document.getElementById("meditList").addEventListener("click",function(e){
    var b=e.target.closest("button[data-del]"); if(!b) return;
    draftMesas.splice(+b.dataset.del,1); renderMedit();
  });
  document.getElementById("addMesaBtn").onclick=function(){
    draftMesas.push({id:uid(),nombre:"",zona:draftMesas.length?draftMesas[draftMesas.length-1].zona:"Sala",capacidad:2});
    renderMedit();
  };
  document.getElementById("mesasCancel").onclick=function(){ dlgM.close(); };
  document.getElementById("mesasSave").onclick=function(){
    cfg.telLocal=document.getElementById("cfgTel").value.trim();
    cfg.plantillaSMS=document.getElementById("cfgSMS").value.trim(); saveCfg();
    state.mesas=draftMesas.filter(function(m){return m.nombre.trim();})
      .map(function(m){return {id:m.id,nombre:m.nombre.trim(),zona:(m.zona||"Sala").trim(),capacidad:m.capacidad};});
    if(!state.mesas.length) state.mesas=DEF_MESAS.slice();
    persistMesas(); dlgM.close(); render();
  };

  // ---------- borrado diario ----------
  // A las 00:00 se eliminan las reservas de los días anteriores.
  // Si la tablet estaba apagada a medianoche, se borran al abrir la app.
  function borrarDiasAnteriores(){
    var hoy=todayISO(), antes=state.reservas.length;
    state.reservas=state.reservas.filter(function(r){ return r.fecha>=hoy; });
    if(state.reservas.length!==antes) persist();
  }
  borrarDiasAnteriores();
  var diaActual=todayISO();
  setInterval(function(){
    var hoy=todayISO();
    if(hoy===diaActual) return;
    if(state.fecha<hoy) state.fecha=hoy;
    diaActual=hoy;
    borrarDiasAnteriores();
    render();
  },30000);

  render();
})();
</script>

<script id="bgFromLogo">
(function(){
  try{
    var bn=document.querySelector(".hero .banner");
    if(!bn) return;
    var bg=getComputedStyle(bn).backgroundImage||"";
    var s=bg.indexOf("data:");
    if(s<0) return;
    var src=bg.slice(s).replace(/["')\s]+$/,"");
    var img=new Image();
    img.onload=function(){
      try{
        var nw=img.naturalWidth, nh=img.naturalHeight;
        var S=Math.max(120, Math.round(Math.min(nw*0.25, nh*0.38)));
        var c=document.createElement("canvas"); c.width=S*2; c.height=S*2;
        var x=c.getContext("2d");
        x.drawImage(img,0,0,S,S,0,0,S,S);
        x.save();x.translate(2*S,0);x.scale(-1,1);x.drawImage(img,0,0,S,S,0,0,S,S);x.restore();
        x.save();x.translate(0,2*S);x.scale(1,-1);x.drawImage(img,0,0,S,S,0,0,S,S);x.restore();
        x.save();x.translate(2*S,2*S);x.scale(-1,-1);x.drawImage(img,0,0,S,S,0,0,S,S);x.restore();
        var t=document.createElement("canvas"); t.width=320; t.height=320;
        t.getContext("2d").drawImage(c,0,0,320,320);
        var uri=t.toDataURL("image/jpeg",0.7);
        var sand=(getComputedStyle(document.documentElement).getPropertyValue("--sand")||"#5c1a23").trim();
        var st=document.createElement("style");
        st.textContent="body{background-color:"+sand+"!important;background-image:url("+uri+")!important;background-repeat:repeat!important;background-position:0 0!important;background-attachment:fixed!important;background-size:320px 320px!important}";
        document.head.appendChild(st);
      }catch(e){}
    };
    img.src=src;
  }catch(e){}
})();
</script>
<script>
(function(){
  var PIN_HASH="c4beddcf557f06a5d8f4761b653b9a430a29b8f8aa574c1b5095b9075bd99209";
  var btn=document.getElementById("gateBtn"), pin=document.getElementById("gatePin"), err=document.getElementById("gateErr");
  function tryUnlock(){
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin.value)).then(function(buf){
      var hex=Array.prototype.map.call(new Uint8Array(buf),function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
      if(hex===PIN_HASH){
        try{ localStorage.setItem("reservas_fenicia_unlocked_v1","1"); }catch(e){}
        document.body.classList.remove("locked");
      } else { err.hidden=false; pin.value=""; pin.focus(); }
    });
  }
  btn.addEventListener("click", tryUnlock);
  pin.addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(); });
  if(document.body.classList.contains("locked")) setTimeout(function(){ pin.focus(); }, 100);
})();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
